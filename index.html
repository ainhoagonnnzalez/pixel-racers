<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <div id="start-screen">
        <h1>PIXEL RACERS</h1>
        <div>
            <h3>Choose your car</h3>
        </div>
        <button id="start-btn">START GAME</button>
    </div>
    <div id="game-screen">
        <h2>GAME</h2>
        <p id="speed">SPEED: 60</p>
        <p id="overtakes">OVERTAKES: </p>
        <p id="time">TIME: 60</p>
        <div id="road">
            <div id="car"></div>
        </div>
            
    </div>
    <div id="end-game">
        <h1>RACE FINISHED</h1>
        <p>SCORE: </p>
        <button id="restart-btn">PLAY AGAIN</button>
        <!-- Resultados finales de la partida -->
<p id="final-speed"></p>
<p id="final-overtakes"></p>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
